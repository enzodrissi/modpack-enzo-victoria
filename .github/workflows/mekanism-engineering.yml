# Suit Mekanism Engineering sur CurseForge : dès qu'un nouveau fichier 1.21.1 NeoForge est publié,
# met à jour mods/mekanism-engineering.pw.toml et pousse. Le serveur le prend au redémarrage suivant.
# ponytail: un seul mod suivi ; passer à `packwiz update --all` pour suivre tout le pack.
name: Suivre Mekanism Engineering
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go install github.com/packwiz/packwiz@latest
      - run: ~/go/bin/packwiz update mekanism-engineering -y
      - run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Met à jour Mekanism Engineering depuis CurseForge"
          git push
