# Serveur dédié Enzo + Victoria (Docker Desktop, image itzg/minecraft-server).
# Lancer : docker compose up -d   (depuis ce dossier)
# EULA: "TRUE" = vous acceptez l'EULA Minecraft (https://aka.ms/MinecraftEULA).
services:
  mc:
    image: itzg/minecraft-server:java21
    container_name: enzo-victoria-mc
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.265"
      # Mods synchronisés avec le pack à chaque démarrage (côté serveur seulement).
      PACKWIZ_URL: https://raw.githubusercontent.com/enzodrissi/modpack-enzo-victoria/main/pack.toml
      # 8 Go fixes, ZGC générationnel : pauses GC < 1 ms, pas de micro-freeze.
      # Tas vivant mesuré ~2 Go à vide : 8 Go laissent de la marge à ZGC et de la RAM à Windows.
      # Huge pages du tas activées par le service thp ci-dessous. Journal GC dans gc.log (/data, existe dès le premier démarrage).
      MEMORY: 8G
      JVM_XX_OPTS: "-XX:+UseZGC -XX:+ZGenerational -XX:+AlwaysPreTouch -XX:+UseTransparentHugePages -XX:+UseStringDeduplication -Xlog:gc:file=/data/gc.log:time:filecount=3,filesize=10M"
      MOTD: "Enzo + Victoria"
      DIFFICULTY: normal
      VIEW_DISTANCE: 12
      SIMULATION_DISTANCE: 10
      SYNC_CHUNK_WRITES: "false"     # écritures de chunks asynchrones
      MAX_TICK_TIME: -1              # pas de crash watchdog pendant la génération lourde
      ALLOW_FLIGHT: "TRUE"           # jetpacks Mekanism, etc.
      SPAWN_PROTECTION: 0
      ENABLE_WHITELIST: "TRUE"
      WHITELIST: iDimonD,vickicoeur
      OPS: iDimonD
      # Reprend une prégénération Chunky interrompue par un redémarrage.
      RCON_CMDS_STARTUP: "chunky continue"
      TZ: Europe/Paris
    volumes:
      # Volume Docker (disque Linux de WSL) : bien plus rapide qu'un dossier Windows monté.
      - mc-data:/data
    depends_on:
      thp:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 2m
    tty: true
    stdin_open: true

  # ZGC ne met son tas en huge pages que si la VM Docker l'autorise pour la mémoire partagée
  # (désactivé par défaut dans WSL). Réglage perdu au redémarrage de WSL, d'où ce service lancé avant mc.
  thp:
    image: alpine:3.20
    privileged: true
    command: sh -c "echo advise > /sys/kernel/mm/transparent_hugepage/shmem_enabled"

  # Tunnel sortant playit.gg : adresse publique fixe, aucune redirection de port sur la box.
  # Même clé sur chaque PC ; un seul serveur allumé à la fois.
  # Activé par server/.env (hors Git) contenant :
  #   COMPOSE_PROFILES=tunnel
  #   SECRET_KEY=<clé secrète de l'agent playit>
  # Sans .env, ce service est ignoré.
  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.2
    container_name: enzo-victoria-playit
    profiles: [tunnel]
    # Partage le réseau du conteneur mc : la cible du tunnel est 127.0.0.1:25565.
    network_mode: "service:mc"
    env_file:
      - path: .env
        required: false
    depends_on:
      mc:
        condition: service_started
        # Réseau partagé : playit doit redémarrer avec mc, sinon il garde un réseau mort.
        restart: true
    restart: unless-stopped

volumes:
  mc-data:
